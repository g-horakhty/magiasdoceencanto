<!DOCTYPE html>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em Manutenção | Magias Doce Encanto</title>
    <style>
        /* Fundo Dinâmico */
        body {
            background: linear-gradient(45deg, #180052, #001940, #004d60);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            font-family: "Segoe UI", "Segoe WP", -apple-system, Roboto, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Estrutura Principal */
        .start-screen {
            max-width: 850px;
            width: 90%;
            padding: 20px;
        }

        /* Cabeçalho e Relógio */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 40px;
        }
        .header-title {
            font-size: 42px;
            font-weight: 200;
            letter-spacing: -1px;
            margin: 0;
        }
        .clock-container { text-align: right; }
        .time { font-size: 36px; font-weight: 300; line-height: 1; }
        .date { font-size: 14px; opacity: 0.8; margin-top: 5px; }

        /* Grid de Blocos (Tiles) */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            grid-auto-rows: 150px;
        }

        /* Configurações Base dos Blocos */
        .tile {
            position: relative;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.15s cubic-bezier(0.2, 0.0, 0.2, 1);
        }
        .tile:active {
            transform: scale(0.95) perspective(500px) rotateX(2deg); /* Efeito de clique 3D */
        }
        .tile-wide { grid-column: span 2; }

        .tile-content {
            padding: 15px;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .tile-icon { font-size: 40px; }
        .tile-title { font-size: 16px; font-weight: 400; margin: 0; }
        .tile-desc { font-size: 13px; opacity: 0.85; margin-top: 5px; }

        /* Cores do Sistema */
        .bg-purple { background-color: #68217A; }
        .bg-blue { background-color: #0078D7; }
        .bg-teal { background-color: #008272; }
        .bg-orange { background-color: #D24726; }
        .bg-dark { background-color: #1d1d1d; }

        /* EFEITOS DINÂMICOS */

        /* 1. Live Tile: Efeito de Deslizar (Slide) */
        .slide-tile .slide-wrapper {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 200%;
            animation: slideUp 8s ease-in-out infinite;
        }
        .slide-page {
            height: 50%; padding: 15px; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        @keyframes slideUp {
            0%, 40% { transform: translateY(0); }
            50%, 90% { transform: translateY(-50%); }
            100% { transform: translateY(0); }
        }

        /* 2. Live Tile: Efeito de Girar 3D (Flip) */
        .flip-tile { perspective: 1000px; background-color: transparent !important; }
        .flip-inner {
            position: relative; width: 100%; height: 100%;
            transform-style: preserve-3d;
            animation: flipIt 6s infinite cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .flip-front, .flip-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden;
        }
        .flip-back { transform: rotateX(180deg); }
        @keyframes flipIt {
            0%, 40% { transform: rotateX(0deg); }
            50%, 90% { transform: rotateX(180deg); }
            100% { transform: rotateX(0deg); }
        }

        /* 3. Animação de Carregamento (Loading Dots) */
        .loader {
            display: flex; gap: 6px; margin-top: 15px;
        }
        .dot {
            width: 6px; height: 6px; background-color: white; border-radius: 50%;
            animation: winLoad 1.5s infinite ease-in-out;
        }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.15s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.45s; }
        .dot:nth-child(5) { animation-delay: 0.6s; }

        @keyframes winLoad {
            0%, 100% { transform: translateY(0); opacity: 0.3; }
            50% { transform: translateY(-10px); opacity: 1; }
        }

        /* Responsividade */
        @media (max-width: 600px) {
            .tile-wide { grid-column: span 1; }
            .header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .clock-container { text-align: left; }
        }
    </style>
</head>
<body>

    <div class="start-screen">
        <header class="header">
            <h1 class="header-title">Magias Doce Encanto</h1>
            <div class="clock-container">
                <div class="time" id="clock">--:--</div>
                <div class="date" id="date">Carregando data...</div>
            </div>
        </header>
        
        <div class="grid">
            
            <!-- Bloco 1: Efeito Slide -->
            <div class="tile tile-wide slide-tile">
                <div class="slide-wrapper">
                    <div class="slide-page bg-purple">
                        <div class="tile-icon">🛠️</div>
                        <p class="tile-title">Site em Manutenção</p>
                    </div>
                    <div class="slide-page bg-dark">
                        <div class="tile-icon">✨</div>
                        <div>
                            <p class="tile-title">Novo recomeço</p>
                            <p class="tile-desc">Preparando melhorias em nossa estrutura.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bloco 2: Efeito 3D Flip -->
            <div class="tile flip-tile">
                <div class="flip-inner">
                    <div class="flip-front bg-teal tile-content">
                        <div class="tile-icon">⏳</div>
                        <p class="tile-title">Status</p>
                    </div>
                    <div class="flip-back bg-orange tile-content">
                        <div class="tile-icon">🚀</div>
                        <p class="tile-title">Desativando site em breve!</p>
                    </div>
                </div>
            </div>

            <!-- Bloco 3: Loader Windows 8 -->
            <div class="tile tile-wide bg-blue tile-content">
                <div>
                    <p class="tile-title">Site em manutenção</p>
                    <p class="tile-desc">Por tempo indeterminado...</p>
                </div>
                <div class="loader">
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
                </div>
            </div>

            <!-- Bloco Estático -->
            <div class="tile bg-dark tile-content">
                <div class="tile-icon">🔒</div>
                <p class="tile-title">Site desativando em 31/12/2026</p>
            </div>

        </div>
    </div>

    <!-- Script para o Relógio em Tempo Real -->
    <script>
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            const dateStr = now.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
            
            document.getElementById('clock').textContent = timeStr;
            document.getElementById('date').textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
